[package]
name = "typst-editor-native"
version = "0.1.0"
edition = "2021"

[lib]
name = "typst_editor_native"
crate-type = ["cdylib"]

[dependencies]
comemo = "0.4"
typst = "0.13.1"
typst-as-lib = { version = "0.13.0", features = ["packages", "typst-kit-fonts", "typst-kit-embed-fonts"] }
typst-pdf = "0.13.1"
typst-svg = "0.13.1"

